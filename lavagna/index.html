<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Lavagna Officina</title>
  <meta name="theme-color" content="#1f2a37">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Lavagna">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/favicon-64.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css?v=42">
  <script>
    // dentro il gestionale: senza accesso (PIN) si torna alla schermata di ingresso del gestionale
    try { if (!sessionStorage.getItem('gid_sessione')) location.replace('../index.html#/'); } catch (e) {}
    // aperta da file del PC (file://) il browser blocca i moduli JavaScript: la lavagna parte solo online
    if (location.protocol === 'file:') document.addEventListener('DOMContentLoaded', () => {
      document.body.innerHTML = '<div style="font-family:system-ui;max-width:520px;margin:12vh auto;padding:24px;text-align:center">'
        + '<h1>Lavagna Officina</h1><p>Aperta direttamente dai file del PC la lavagna non può partire: il browser blocca alcune sue parti per sicurezza.</p>'
        + '<p>Funziona normalmente dall\'indirizzo online (GitHub Pages) del gestionale.</p>'
        + '<p><a href="../index.html#/" style="display:inline-block;padding:12px 20px;background:#16324f;color:#fff;border-radius:10px;text-decoration:none;font-weight:700">‹ Torna al gestionale</a></p></div>';
    });
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><a class="icon-btn torna-gest" href="../index.html#/" aria-label="Torna al gestionale" title="Torna al gestionale">‹</a><a href="../index.html#/" class="brand-logo" title="Torna al gestionale"><img src="logo.png" alt="Gru Impianti"></a></div>
    <div class="month-nav">
      <button class="icon-btn" id="prevBtn" data-action="prev" aria-label="Precedente">‹</button>
      <h1 id="monthLabel"></h1>
      <button class="icon-btn" id="nextBtn" data-action="next" aria-label="Successivo">›</button>
    </div>
    <div class="top-right">
      <button class="btn ghost sm" data-action="today">Oggi</button>
      <button class="menu-btn" id="menuBtn" data-action="menu" aria-label="Menu">
        <span class="burger"><i></i><i></i><i></i></span><span id="statusDot" class="dot"></span>
      </button>
    </div>
    <div id="menu" class="menu" hidden></div>
  </header>

  <div id="testBanner" class="banner test-banner" hidden>🧪 Modalità test: le modifiche alla lavagna restano su questo dispositivo, quella vera non cambia.</div>
  <div id="localBanner" class="banner" hidden>
    Modalità locale: i dati restano solo su questo dispositivo.
  </div>

  <main class="layout">
    <section class="board">
      <div id="boardBar" class="board-bar"></div>
      <div id="grid" class="grid"></div>
      <div id="dayView" class="day-view" hidden></div>
    </section>
  </main>

  <div id="drawerBack" class="drawer-back" data-action="drawer-close" hidden></div>
  <aside id="panel" class="panel drawer" data-tray aria-label="Magneti del mese"></aside>

  <div id="loginScreen" class="login" hidden>
    <div class="login-card">
      <img class="login-logo" src="logo.png" alt="Gru Impianti">
      <h1>Lavagna Officina</h1>
      <p id="loginMsg">Accedi con il tuo account Google per vedere la lavagna.</p>
      <button class="btn google" data-action="login" id="loginBtn">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
        Accedi con Google
      </button>
      <button class="btn ghost" data-action="logout" id="loginLogout" hidden>Esci e cambia account</button>
    </div>
  </div>

  <div id="placingBar" class="placing-bar" hidden></div>
  <div id="modal" class="modal" hidden></div>
  <div id="infoPop" class="info-pop" hidden></div>
  <div id="toast" class="toast" hidden></div>
  <div id="printArea" aria-hidden="true"></div>

  <script src="../js/pdf.js?v=0.27.0"></script>
  <script type="module" src="app.js?v=42"></script>
</body>
</html>
